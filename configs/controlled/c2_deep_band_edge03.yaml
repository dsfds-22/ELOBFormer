dataset:
  root: datasets/emergency_outer_boundary_grouped_fixed12_v2_clean601
  train_csv: splits/train.csv
  val_csv: splits/val.csv
  test_csv: splits/test.csv
  image_size: [450, 800]
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

model:
  name: elobformer_a1
  variant: b1
  decoder_dim: 256
  dropout: 0.1
  pretrained_backbone: weights/pretrained/segformer-B1.pth

loss:
  band: 1.0
  edge: 0.3

train:
  output_dir: runs/emergency_boundary/controlled_ablation_20260807/c2_deep_band_edge03_seed42
  epochs: 80
  batch_size: 4
  augmentation: basic
  early_stop_patience: 15
  evaluate_test_after_training: true
  test_threshold: 0.5
  num_workers: 0
  lr: 0.0001
  weight_decay: 0.01
  amp: true
  deterministic: true
  seed: 42
  log_interval: 20
  val_interval: 1
  save_interval: 0
  max_train_steps: 0
  max_val_steps: 0
  sampling:
    mode: sqrt_scene
    replacement: true
    num_samples: 0
    group_fields:
      - scene_segment
      - capture_session
      - prefix
